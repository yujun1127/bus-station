<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="refresh" content="5"/>
  <title>🚌 버스 대시보드 — 초기화 중</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;600&family=Space+Mono&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0d1117;--accent:#f78166;--text:#c9d1d9;--muted:#8b949e}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;
      min-height:100vh;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:1.5rem;text-align:center;padding:2rem}
    .spinner{width:52px;height:52px;border:3px solid rgba(247,129,102,.2);
      border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    h1{font-size:1.6rem;font-weight:600}
    p{color:var(--muted);font-size:.875rem;max-width:360px;line-height:1.75}
    code{font-family:'Space Mono',monospace;background:rgba(247,129,102,.1);
      border:1px solid rgba(247,129,102,.2);color:var(--accent);padding:2px 8px;border-radius:5px}
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h1>🚌 버스 데이터 수집 중…</h1>
  <p><code>data-generator</code>가 API에서 데이터를 가져오고 있습니다.<br><br>5초 후 자동 새로고침됩니다.</p>
</body>
</html>
