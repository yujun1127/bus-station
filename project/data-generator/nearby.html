<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>🚌 울산 버스 정류장 지도</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey="KAKAO_API"&libraries=services,clusterer"></script>
  <style>
    :root{
      --bg:#0d1117;--surface:#161b22;--surface2:#1c2333;--surface3:#21262d;
      --border:rgba(48,54,61,.9);--accent:#f78166;--accent2:#79c0ff;
      --green:#56d364;--amber:#e3b341;--text:#c9d1d9;--muted:#8b949e;--radius:12px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);
      display:flex;flex-direction:column;height:100dvh;overflow:hidden}

    /* ── 헤더 ── */
    header{background:var(--surface);border-bottom:1px solid var(--border);
      padding:.6rem 1rem;display:flex;align-items:center;gap:.6rem;flex-shrink:0;z-index:20}
    .back-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);
      padding:.3rem .7rem;border-radius:8px;font-size:.78rem;cursor:pointer;
      text-decoration:none;display:flex;align-items:center;gap:.3rem;white-space:nowrap}
    .back-btn:hover{border-color:var(--accent);color:var(--accent)}
    header h1{font-size:.95rem;font-weight:700;flex:1}
    .live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);
      animation:pulse 2s infinite;flex-shrink:0}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.5)}}
    #clock{font-family:'Space Mono',monospace;font-size:.7rem;color:var(--muted);white-space:nowrap}

    /* ── 상태 배너 ── */
    #banner{background:var(--surface2);border-bottom:1px solid var(--border);
      padding:.3rem 1rem;font-size:.7rem;color:var(--muted);text-align:center;
      flex-shrink:0;transition:color .3s}

    /* ── 레이아웃 ── */
    .layout{display:flex;flex:1;overflow:hidden;position:relative}
    #map{flex:1;min-width:0}

    /* ── 사이드 패널 ── */
    #panel{width:360px;flex-shrink:0;display:flex;flex-direction:column;
      border-left:1px solid var(--border);background:var(--surface);overflow:hidden;
      transition:width .25s}
    #panel.collapsed{width:0;border-left:none}
    .panel-toggle{position:absolute;right:360px;top:50%;transform:translateY(-50%);
      z-index:10;background:var(--surface);border:1px solid var(--border);
      color:var(--text);width:22px;height:44px;cursor:pointer;display:flex;
      align-items:center;justify-content:center;font-size:.8rem;border-radius:6px 0 0 6px;
      transition:right .25s}
    .panel-toggle.collapsed{right:0;border-radius:6px}

    @media(max-width:720px){
      .layout{flex-direction:column}
      #map{flex:0 0 45dvh}
      #panel{width:100%!important;border-left:none;border-top:1px solid var(--border);flex:1}
      .panel-toggle{display:none}
    }

    /* ── 탭 ── */
    .tabs{display:flex;background:var(--surface2);border-bottom:1px solid var(--border);flex-shrink:0}
    .tab{flex:1;padding:.55rem .3rem;font-size:.72rem;font-weight:600;text-align:center;
      cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;transition:.2s;white-space:nowrap}
    .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
    .panel-body{flex:1;overflow-y:auto;padding:.7rem}

    /* ── 검색 / 필터 바 ── */
    .filter-bar{padding:.5rem .7rem;background:var(--surface2);border-bottom:1px solid var(--border);flex-shrink:0;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
    .search-input{flex:1;min-width:120px;background:var(--surface3);border:1px solid var(--border);
      color:var(--text);padding:.35rem .65rem;border-radius:7px;font-size:.78rem;outline:none}
    .search-input:focus{border-color:var(--accent2)}
    .filter-btn{background:var(--surface3);border:1px solid var(--border);color:var(--muted);
      padding:.3rem .6rem;border-radius:6px;font-size:.68rem;font-weight:700;cursor:pointer;white-space:nowrap}
    .filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(247,129,102,.08)}

    /* ── 노선 선택 칩 ── */
    .route-chips{display:flex;flex-wrap:wrap;gap:.3rem;padding:.5rem .7rem;
      background:var(--surface2);border-bottom:1px solid var(--border);
      flex-shrink:0;max-height:80px;overflow-y:auto}
    .chip{font-size:.68rem;font-weight:700;font-family:'Space Mono',monospace;
      padding:3px 9px;border-radius:5px;border:1px solid var(--border);
      cursor:pointer;color:var(--muted);background:var(--surface3);transition:.15s}
    .chip:hover{border-color:var(--accent2);color:var(--accent2)}
    .chip.selected{border-color:var(--accent);color:#0d1117;background:var(--accent)}
    .chip-clear{font-size:.68rem;color:var(--muted);cursor:pointer;padding:3px 7px;
      border:1px dashed var(--border);border-radius:5px}
    .chip-clear:hover{color:var(--accent);border-color:var(--accent)}

    /* ── 정류장 목록 카드 ── */
    .stop-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;
      padding:.65rem .85rem;margin-bottom:.45rem;cursor:pointer;transition:.15s}
    .stop-card:hover,.stop-card.sel{border-color:var(--accent);background:rgba(247,129,102,.06)}
    .stop-name{font-weight:700;font-size:.85rem;margin-bottom:.18rem}
    .stop-meta{font-size:.68rem;color:var(--muted);display:flex;gap:.6rem;flex-wrap:wrap}
    .stop-dist{font-family:'Space Mono',monospace;color:var(--accent2);font-weight:700}
    .route-tags{display:flex;flex-wrap:wrap;gap:.2rem;margin-top:.35rem}
    .rtag{font-size:.62rem;padding:1px 6px;border-radius:4px;border:1px solid;font-weight:700}

    /* ── 상세 패널 ── */
    .detail-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.65rem;flex-wrap:wrap}
    .detail-name{font-weight:700;font-size:.95rem;flex:1}
    .refresh-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);
      padding:.22rem .55rem;border-radius:6px;font-size:.7rem;cursor:pointer}
    .refresh-btn:hover{border-color:var(--accent);color:var(--accent)}
    .bus-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;
      padding:.65rem .85rem;margin-bottom:.45rem}
    .bus-route{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;margin-bottom:.2rem}
    .rte-no{font-family:'Space Mono',monospace;font-size:.88rem;font-weight:700;
      color:#fff;background:var(--surface3);border:1px solid var(--border);padding:2px 8px;border-radius:6px}
    .cat-pill{font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:5px;border:1px solid}
    .bus-sub{font-size:.68rem;color:var(--muted);margin-top:.12rem}

    /* ── 배차 ── */
    .sched-route-sel{display:flex;gap:.35rem;flex-wrap:wrap;margin:.5rem 0}
    .sched-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);
      padding:.28rem .65rem;border-radius:6px;font-size:.72rem;cursor:pointer;font-family:'Space Mono',monospace;font-weight:700}
    .sched-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(247,129,102,.08)}
    .sched-wrap{max-height:calc(100dvh - 340px);overflow-y:auto}
    .sched-table{width:100%;border-collapse:collapse}
    .sched-table th{position:sticky;top:0;background:var(--surface2);z-index:1;
      padding:.4rem .65rem;font-size:.62rem;color:var(--muted);text-align:left;
      font-weight:600;text-transform:uppercase;border-bottom:1px solid var(--border)}
    .sched-table td{padding:.37rem .65rem;font-size:.75rem;border-top:1px solid var(--border);font-family:'Space Mono',monospace}
    .sched-table tr.now-row td{background:rgba(247,129,102,.07);color:var(--accent);font-weight:700}
    .sched-table tr.past-row td{color:var(--muted)}
    .est-badge{font-size:.6rem;background:rgba(121,192,255,.08);border:1px solid rgba(121,192,255,.2);color:var(--accent2);padding:1px 5px;border-radius:4px;margin-left:3px}

    /* ── 통계 ── */
    .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.7rem}
    .stat-box{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:.7rem .9rem}
    .stat-lbl{font-size:.63rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
    .stat-val{font-size:1.5rem;font-weight:700;font-family:'Space Mono',monospace;color:#fff;line-height:1.1}
    .stat-sub{font-size:.63rem;color:var(--muted)}

    /* ── 공통 ── */
    .status{text-align:center;padding:2rem 1rem;color:var(--muted);font-size:.83rem;line-height:1.9}
    .status .emoji{font-size:2rem;display:block;margin-bottom:.4rem}
    .locate-btn{margin-top:.7rem;background:var(--accent);color:#0d1117;font-weight:700;
      border:none;padding:.5rem 1.3rem;border-radius:8px;font-size:.83rem;cursor:pointer}
    .spinner{width:28px;height:28px;border:3px solid rgba(247,129,102,.2);
      border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:.4rem auto}
    @keyframes spin{to{transform:rotate(360deg)}}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
  </style>
</head>
<body>
<header>
  <a class="back-btn" href="/index.html">← 밀집도</a>
  <h1>🚌 울산 버스 정류장 지도</h1>
  <span class="live-dot"></span>
  <span id="clock"></span>
</header>
<div id="banner">⏳ 데이터 로딩 중…</div>

<div class="layout">
  <div id="map"></div>
  <button class="panel-toggle" id="toggleBtn" onclick="togglePanel()" title="패널 열기/닫기">◀</button>

  <div id="panel">
    <div class="tabs">
      <div class="tab active" data-tab="stops">🗺️ 정류장</div>
      <div class="tab" data-tab="nearby">📍 내 주변</div>
      <div class="tab" data-tab="schedule">📅 배차</div>
      <div class="tab" data-tab="stats">📊 통계</div>
    </div>

    <!-- 노선 칩 필터 (정류장 탭 전용) -->
    <div class="route-chips" id="routeChips" style="display:none">
      <span class="chip-clear" onclick="clearRouteFilter()">✕ 전체</span>
    </div>

    <!-- 검색 / 필터 바 -->
    <div class="filter-bar" id="filterBar" style="display:none">
      <input class="search-input" id="searchInput" placeholder="정류장 이름 검색…" oninput="onSearch()" />
      <button class="filter-btn active" id="btnAll" onclick="setFilter('all')">전체</button>
      <button class="filter-btn" id="btnNear" onclick="setFilter('near')">내 주변</button>
      <button class="filter-btn" id="locBtn" onclick="startLocate()">📍 위치</button>
    </div>

    <div class="panel-body" id="panelBody">
      <div class="status"><div class="spinner"></div>데이터 로딩 중…</div>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════
   설정
════════════════════════════════════════════ */
const NEAR_RADIUS = 1000;   // 내 주변 기본 반경 (m)
const MAX_LIST    = 60;     // 목록 최대 표시 수

/* 노선 유형 색상 */
const CAT = {
  "일반시내버스":  {color:"#e3b341",bg:"rgba(227,179,65,.12)"},
  "좌석·직행좌석": {color:"#79c0ff",bg:"rgba(121,192,255,.12)"},
  "순환버스":      {color:"#56d364",bg:"rgba(86,211,100,.12)"},
  "지선버스":      {color:"#f78166",bg:"rgba(247,129,102,.12)"},
  "기타":          {color:"#8b949e",bg:"rgba(139,148,158,.10)"},
};

/* ════════════════════════════════════════════
   상태
════════════════════════════════════════════ */
let map, clusterer;
let myMarker, myLat, myLon;
let allMarkers = [];          // {marker, overlay, stop, visible}
let stopsData  = null;        // stops_data.json
let busData    = null;        // bus_data.json
let activeTab  = "stops";
let filterMode = "all";       // "all" | "near"
let searchQ    = "";
let selectedRoute = null;     // 선택된 노선번호 (필터)
let selectedStop  = null;     // 선택된 정류장 객체
let panelOpen  = true;

/* ════════════════════════════════════════════
   시계
════════════════════════════════════════════ */
function tickClock(){
  const d=new Date();
  document.getElementById("clock").textContent=
    d.toLocaleTimeString("ko-KR",{hour12:false,hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
tickClock(); setInterval(tickClock,1000);

/* ════════════════════════════════════════════
   탭
════════════════════════════════════════════ */
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  activeTab=t.dataset.tab;
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active");

  const routeChips=document.getElementById("routeChips");
  const filterBar =document.getElementById("filterBar");
  routeChips.style.display = activeTab==="stops" ? "flex" : "none";
  filterBar.style.display  = activeTab==="stops"||activeTab==="nearby" ? "flex" : "none";
  renderPanel();
}));

/* ════════════════════════════════════════════
   패널 토글
════════════════════════════════════════════ */
function togglePanel(){
  panelOpen=!panelOpen;
  const panel=document.getElementById("panel");
  const btn  =document.getElementById("toggleBtn");
  panel.classList.toggle("collapsed",!panelOpen);
  btn.textContent = panelOpen?"◀":"▶";
  btn.style.right = panelOpen?"360px":"0";
}

/* ════════════════════════════════════════════
   카카오맵 초기화
════════════════════════════════════════════ */
window.addEventListener("load",()=>{
  const wait=setInterval(()=>{
    if(typeof kakao==="undefined"||!kakao.maps) return;
    clearInterval(wait);

    map=new kakao.maps.Map(document.getElementById("map"),{
      center:new kakao.maps.LatLng(35.5384,129.3114),
      level:8   // 울산 전체 보이는 줌 레벨
    });

    // 마커 클러스터러 (많은 마커를 자동으로 묶음)
    clusterer=new kakao.maps.MarkerClusterer({
      map, averageCenter:true, minLevel:5,
      disableClickZoom:false,
      styles:[{
        width:"40px",height:"40px",background:"rgba(247,129,102,.85)",
        borderRadius:"50%",color:"#fff",fontSize:"13px",fontWeight:"700",
        textAlign:"center",lineHeight:"40px",border:"2px solid rgba(255,255,255,.6)"
      },{
        width:"50px",height:"50px",background:"rgba(247,129,102,.9)",
        borderRadius:"50%",color:"#fff",fontSize:"14px",fontWeight:"700",
        textAlign:"center",lineHeight:"50px",border:"2px solid rgba(255,255,255,.7)"
      },{
        width:"60px",height:"60px",background:"rgba(247,129,102,.95)",
        borderRadius:"50%",color:"#fff",fontSize:"15px",fontWeight:"700",
        textAlign:"center",lineHeight:"60px",border:"2px solid #fff"
      }]
    });

    loadData();
  },200);
});

/* ════════════════════════════════════════════
   데이터 로드 (bus_data.json + stops_data.json)
════════════════════════════════════════════ */
async function loadData(){
  const banner=document.getElementById("banner");
  try{
    const [r1,r2]=await Promise.all([
      fetch("/bus_data.json"),
      fetch("/stops_data.json")
    ]);
    busData   = r1.ok ? await r1.json() : null;
    stopsData = r2.ok ? await r2.json() : null;

    if(!stopsData||!stopsData.stops||stopsData.stops.length===0){
      banner.textContent="⚠️ 정류장 데이터가 없습니다 (stops_data.json). data-generator 로그를 확인하세요.";
      banner.style.color="var(--accent)";
      showStatus("⚠️","정류장 데이터를 불러올 수 없습니다.<br>data-generator 컨테이너가 실행 중인지 확인하세요.");
      return;
    }

    const updAt = stopsData.updated_at || "—";
    banner.textContent=`✅ 정류장 ${stopsData.total_stops}개 · 버스 ${busData?.total_buses||0}대 운행 중 · 갱신: ${updAt.slice(0,16)}`;
    banner.style.color="var(--green)";

    buildMarkers();
    buildRouteChips();
    document.getElementById("routeChips").style.display="flex";
    document.getElementById("filterBar").style.display="flex";
    renderPanel();
    startLocate();  // 자동으로 위치 시도
  }catch(e){
    banner.textContent=`⚠️ 로드 실패: ${e.message}`;
    banner.style.color="var(--accent)";
    showStatus("⚠️",`데이터 로드 실패: ${e.message}`,true);
  }
}

/* ════════════════════════════════════════════
   마커 생성 (전체 정류장)
════════════════════════════════════════════ */
function makeStopMarker(stop){
  const pos=new kakao.maps.LatLng(stop.lat,stop.lot);

  // 기본 마커 (작은 원형 오버레이)
  const dot=document.createElement("div");
  dot.style.cssText=`width:10px;height:10px;border-radius:50%;background:#79c0ff;
    border:1.5px solid rgba(255,255,255,.7);cursor:pointer;transition:.15s;
    box-shadow:0 1px 4px rgba(0,0,0,.4)`;

  const ov=new kakao.maps.CustomOverlay({position:pos,content:dot,zIndex:3});

  // 클릭 이벤트
  dot.addEventListener("click",()=>onStopClick(stop));
  dot.addEventListener("mouseenter",()=>{
    dot.style.transform="scale(1.6)";
    dot.style.background="#f78166";
  });
  dot.addEventListener("mouseleave",()=>{
    if(selectedStop?.arsId!==stop.arsId){
      dot.style.transform="";
      dot.style.background="#79c0ff";
    }
  });

  // 클러스터러용 더미 마커 (위치 추적만)
  const dummyMarker=new kakao.maps.Marker({position:pos});

  return {ov, dummyMarker, dot, stop, visible:true};
}

function buildMarkers(){
  // 기존 마커 제거
  allMarkers.forEach(m=>{m.ov.setMap(null);});
  clusterer.clear();
  allMarkers=[];

  stopsData.stops.forEach(stop=>{
    const m=makeStopMarker(stop);
    m.ov.setMap(map);
    allMarkers.push(m);
  });

  // 클러스터러에 더미 마커 추가 (줌 레벨별 자동 묶음)
  clusterer.addMarkers(allMarkers.map(m=>m.dummyMarker));

  // 줌 레벨에 따라 오버레이 표시/숨김
  kakao.maps.event.addListener(map,"zoom_changed",updateOverlayVisibility);
  updateOverlayVisibility();
}

function updateOverlayVisibility(){
  const level=map.getLevel();
  // 레벨 6 이하(줌 인)에서만 개별 오버레이 표시
  const show = level<=6;
  allMarkers.forEach(m=>{
    if(m.visible){
      m.ov.setMap(show ? map : null);
    }
  });
}

/* ════════════════════════════════════════════
   노선 칩 필터 구성
════════════════════════════════════════════ */
function buildRouteChips(){
  const container=document.getElementById("routeChips");
  // 모든 노선 수집
  const routeSet=new Map();
  stopsData.stops.forEach(s=>(s.routes||[]).forEach(r=>{
    if(!routeSet.has(r.rteNo)) routeSet.set(r.rteNo,r.category||classifyRoute(r.rteNo));
  }));
  const sorted=[...routeSet.entries()].sort((a,b)=>a[0].localeCompare(b[0],undefined,{numeric:true}));

  container.innerHTML='<span class="chip-clear" onclick="clearRouteFilter()">✕ 전체</span>';
  sorted.forEach(([rno,cat])=>{
    const {color}=CAT[cat]||CAT["기타"];
    const chip=document.createElement("span");
    chip.className="chip";
    chip.textContent=rno;
    chip.style.borderColor=color+"60";
    chip.style.color=color;
    chip.dataset.rno=rno;
    chip.addEventListener("click",()=>selectRouteFilter(rno));
    container.appendChild(chip);
  });
}

function selectRouteFilter(rno){
  selectedRoute=rno;
  document.querySelectorAll("#routeChips .chip").forEach(c=>{
    c.classList.toggle("selected",c.dataset.rno===rno);
  });
  applyMarkerFilter();
  renderPanel();
  // 해당 노선 정류장 위치로 지도 이동
  zoomToFilteredStops();
}

function clearRouteFilter(){
  selectedRoute=null;
  document.querySelectorAll("#routeChips .chip").forEach(c=>c.classList.remove("selected"));
  applyMarkerFilter();
  renderPanel();
}

/* ════════════════════════════════════════════
   마커 필터 적용
════════════════════════════════════════════ */
function applyMarkerFilter(){
  const level=map.getLevel();
  const showOv=level<=6;
  const q=searchQ.toLowerCase();

  allMarkers.forEach(m=>{
    const s=m.stop;
    let show=true;

    // 노선 필터
    if(selectedRoute){
      show=(s.routes||[]).some(r=>r.rteNo===selectedRoute);
    }
    // 검색 필터
    if(show && q){
      show=s.bsNm.toLowerCase().includes(q)||(s.arsId||"").includes(q);
    }
    // 내 주변 필터
    if(show && filterMode==="near" && myLat){
      show=haversine(myLat,myLon,s.lat,s.lot)<=NEAR_RADIUS;
    }

    m.visible=show;
    m.ov.setMap(show&&showOv ? map : null);
    // 클러스터러용 마커는 숨김 처리(remove/add로 관리)
  });

  // 클러스터러 업데이트
  clusterer.clear();
  clusterer.addMarkers(allMarkers.filter(m=>m.visible).map(m=>m.dummyMarker));
}

function zoomToFilteredStops(){
  const visible=allMarkers.filter(m=>m.visible);
  if(!visible.length) return;
  if(visible.length===1){
    map.setCenter(new kakao.maps.LatLng(visible[0].stop.lat,visible[0].stop.lot));
    map.setLevel(4); return;
  }
  const bounds=new kakao.maps.LatLngBounds();
  visible.forEach(m=>bounds.extend(new kakao.maps.LatLng(m.stop.lat,m.stop.lot)));
  map.setBounds(bounds,40);
}

/* ════════════════════════════════════════════
   위치 측위
════════════════════════════════════════════ */
function startLocate(){
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(onGPS, ()=>{}, {enableHighAccuracy:true,timeout:10000});
}

function onGPS(pos){
  myLat=pos.coords.latitude; myLon=pos.coords.longitude;
  const latlng=new kakao.maps.LatLng(myLat,myLon);

  if(myMarker) myMarker.setMap(null);
  myMarker=new kakao.maps.CustomOverlay({
    position:latlng,
    content:'<div style="width:16px;height:16px;border-radius:50%;background:#f78166;border:3px solid #fff;box-shadow:0 0 10px rgba(247,129,102,.8)"></div>',
    zIndex:15
  });
  myMarker.setMap(map);

  // 내 주변 탭으로 전환 시 지도 이동
  if(activeTab==="nearby"){
    map.setCenter(latlng); map.setLevel(5);
    applyMarkerFilter();
  }
  if(activeTab==="stops"&&filterMode==="near") applyMarkerFilter();
  renderPanel();
}

/* ════════════════════════════════════════════
   검색 / 필터 이벤트
════════════════════════════════════════════ */
function onSearch(){
  searchQ=document.getElementById("searchInput").value;
  applyMarkerFilter();
  renderPanel();
}

function setFilter(mode){
  filterMode=mode;
  document.getElementById("btnAll").classList.toggle("active",mode==="all");
  document.getElementById("btnNear").classList.toggle("active",mode==="near");
  if(mode==="near" && myLat) map.setCenter(new kakao.maps.LatLng(myLat,myLon));
  applyMarkerFilter();
  renderPanel();
}

/* ════════════════════════════════════════════
   정류장 클릭
════════════════════════════════════════════ */
function onStopClick(stop){
  selectedStop=stop;
  // 선택 마커 하이라이트
  allMarkers.forEach(m=>{
    const sel=m.stop.arsId===stop.arsId;
    m.dot.style.background=sel?"#f78166":"#79c0ff";
    m.dot.style.transform=sel?"scale(1.8)":"";
    m.dot.style.zIndex=sel?"10":"";
  });
  // 도착정보 탭으로 전환
  activeTab="nearby";
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.tab==="nearby"));
  document.getElementById("routeChips").style.display="none";
  document.getElementById("filterBar").style.display="flex";
  // 지도 이동
  map.panTo(new kakao.maps.LatLng(stop.lat,stop.lot));
  renderPanel();
}

/* ════════════════════════════════════════════
   패널 렌더링
════════════════════════════════════════════ */
function renderPanel(){
  const body=document.getElementById("panelBody");
  if(activeTab==="stops")    body.innerHTML=renderStopsTab();
  if(activeTab==="nearby")   body.innerHTML=renderNearbyTab();
  if(activeTab==="schedule") body.innerHTML=renderScheduleTab();
  if(activeTab==="stats")    body.innerHTML=renderStatsTab();

  // 이벤트 바인딩
  if(activeTab==="stops"){
    body.querySelectorAll(".stop-card").forEach(el=>{
      const arsId=el.dataset.arsid;
      el.addEventListener("click",()=>{
        const stop=stopsData.stops.find(s=>s.arsId===arsId);
        if(stop){map.panTo(new kakao.maps.LatLng(stop.lat,stop.lot));map.setLevel(4);onStopClick(stop);}
      });
    });
  }
  if(activeTab==="schedule"){
    body.querySelectorAll(".sched-btn").forEach(btn=>{
      btn.addEventListener("click",()=>{
        body.querySelectorAll(".sched-btn").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("schedContent").innerHTML=renderSchedContent(btn.dataset.rno);
      });
    });
    const first=body.querySelector(".sched-btn");
    if(first) first.click();
  }
}

/* ── 정류장 탭 ── */
function renderStopsTab(){
  if(!stopsData) return '<div class="status"><div class="spinner"></div>로딩 중…</div>';

  let stops=stopsData.stops;

  // 필터 적용
  if(selectedRoute) stops=stops.filter(s=>(s.routes||[]).some(r=>r.rteNo===selectedRoute));
  if(searchQ){
    const q=searchQ.toLowerCase();
    stops=stops.filter(s=>s.bsNm.toLowerCase().includes(q)||s.arsId.includes(q));
  }
  if(filterMode==="near"&&myLat)
    stops=stops.filter(s=>haversine(myLat,myLon,s.lat,s.lot)<=NEAR_RADIUS)
               .sort((a,b)=>haversine(myLat,myLon,a.lat,a.lot)-haversine(myLat,myLon,b.lat,b.lot));

  if(!stops.length) return `<div class="status"><span class="emoji">🔍</span>${selectedRoute?`노선 <strong>${selectedRoute}</strong>의 정류장이 없습니다.`:"검색 결과가 없습니다."}</div>`;

  const total=stops.length;
  const shown=stops.slice(0,MAX_LIST);
  let html=`<div style="font-size:.68rem;color:var(--muted);margin-bottom:.5rem">${selectedRoute?`🛣️ <strong style="color:var(--accent)">${selectedRoute}번</strong> 정류장 `:""} ${total}개${total>MAX_LIST?` (상위 ${MAX_LIST}개 표시)`:""}</div>`;

  shown.forEach(s=>{
    const dist=myLat?haversine(myLat,myLon,s.lat,s.lot):null;
    const distStr=dist?`<span class="stop-dist">${Math.round(dist)}m</span>`:"";
    const routeTags=(s.routes||[]).slice(0,6).map(r=>{
      const cat=r.category||classifyRoute(r.rteNo);
      const {color}=CAT[cat]||CAT["기타"];
      const hl=selectedRoute===r.rteNo?`background:${color};color:#0d1117`:`border-color:${color}60;color:${color}`;
      return `<span class="rtag" style="${hl}">${r.rteNo}</span>`;
    }).join("");
    const sel=selectedStop?.arsId===s.arsId?"sel":"";
    html+=`<div class="stop-card ${sel}" data-arsid="${s.arsId}">
      <div class="stop-name">🚏 ${s.bsNm}</div>
      <div class="stop-meta">${distStr}<span>ID: ${s.arsId}</span><span>📍 ${s.lat.toFixed(4)},${s.lot.toFixed(4)}</span></div>
      <div class="route-tags">${routeTags||'<span style="color:var(--muted);font-size:.65rem">노선 정보 없음</span>'}</div>
    </div>`;
  });
  return html;
}

/* ── 내 주변 탭: 선택된 정류장 또는 주변 버스 ── */
function renderNearbyTab(){
  if(selectedStop) return renderStopDetail(selectedStop);

  if(!myLat) return `<div class="status"><span class="emoji">📡</span>위치를 허용하면 주변 버스를 확인할 수 있습니다.<br><button class="locate-btn" onclick="startLocate()">📍 위치 찾기</button></div>`;

  if(!busData?.locations) return '<div class="status"><span class="emoji">⚠️</span>버스 위치 데이터가 없습니다.</div>';

  const nearby=busData.locations
    .map(b=>({...b,dist:haversine(myLat,myLon,b.lat,b.lot)}))
    .filter(b=>b.dist<=NEAR_RADIUS)
    .sort((a,b)=>a.dist-b.dist);

  if(!nearby.length) return `<div class="status"><span class="emoji">😔</span>반경 ${NEAR_RADIUS/1000}km 이내 운행 중인 버스가 없습니다.</div>`;

  // 노선별 그룹
  const byRoute={};
  nearby.forEach(b=>{
    if(!byRoute[b.rteNo]) byRoute[b.rteNo]={rteNo:b.rteNo,category:b.category,buses:[]};
    byRoute[b.rteNo].buses.push(b);
  });

  let html=`<div style="font-size:.7rem;color:var(--muted);margin-bottom:.6rem">반경 ${NEAR_RADIUS/1000}km · ${nearby.length}대 운행 중 · 갱신 ${busData.updated_at?.slice(11,16)||"—"}</div>`;
  html+=Object.values(byRoute).map(r=>{
    const cat=r.category||classifyRoute(r.rteNo);
    const {color,bg}=CAT[cat]||CAT["기타"];
    const vlist=r.buses.slice(0,4).map(b=>`<span style="font-size:.65rem;font-family:'Space Mono',monospace;color:var(--muted);background:var(--surface3);padding:1px 5px;border-radius:4px">${b.vhclNo}</span>`).join(" ");
    return `<div class="bus-card">
      <div class="bus-route"><span class="rte-no">${r.rteNo}</span>
        <span class="cat-pill" style="border-color:${color};color:${color};background:${bg}">${cat}</span>
        <span style="font-size:.7rem;color:var(--green);font-weight:700">${r.buses.length}대</span></div>
      <div class="bus-sub">최근거리 ${Math.round(r.buses[0].dist)}m · 차량 ${vlist}</div>
    </div>`;
  }).join("");
  return html;
}

/* ── 정류장 상세 (버스 목록) ── */
function renderStopDetail(stop){
  const routes=stop.routes||[];
  let html=`<div class="detail-header">
    <button onclick="selectedStop=null;renderPanel()" style="background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:.22rem .55rem;border-radius:6px;font-size:.7rem;cursor:pointer">← 목록</button>
    <span class="detail-name">🚏 ${stop.bsNm}</span>
  </div>
  <div style="font-size:.68rem;color:var(--muted);margin-bottom:.65rem">ID: ${stop.arsId} · 📍 ${stop.lat.toFixed(4)}, ${stop.lot.toFixed(4)}</div>`;

  if(!routes.length){
    html+='<div style="color:var(--muted);font-size:.8rem;text-align:center;padding:1rem">이 정류장의 노선 정보가 없습니다.</div>';
    return html;
  }

  // 이 정류장을 지나는 버스 (bus_data 기준)
  const here=busData?.locations?.filter(b=>{
    const dist=haversine(stop.lat,stop.lot,b.lat,b.lot);
    return dist<300 && routes.some(r=>r.rteNo===b.rteNo);
  }) || [];

  const hereByRoute={};
  here.forEach(b=>{
    if(!hereByRoute[b.rteNo]) hereByRoute[b.rteNo]=[];
    hereByRoute[b.rteNo].push(b);
  });

  html+=routes.map(r=>{
    const cat=r.category||classifyRoute(r.rteNo);
    const {color,bg}=CAT[cat]||CAT["기타"];
    const buses=hereByRoute[r.rteNo]||[];
    const nowTag=buses.length?`<span style="font-size:.68rem;color:var(--green);font-weight:700">🟢 ${buses.length}대 근처</span>`:"<span style='font-size:.65rem;color:var(--muted)'>운행 정보 없음</span>";
    return `<div class="bus-card">
      <div class="bus-route"><span class="rte-no">${r.rteNo}</span>
        <span class="cat-pill" style="border-color:${color};color:${color};background:${bg}">${cat}</span>
        ${nowTag}</div>
    </div>`;
  }).join("");
  return html;
}

/* ── 배차 탭 ── */
function renderScheduleTab(){
  if(!stopsData) return '<div class="status"><div class="spinner"></div>로딩 중…</div>';

  // 선택된 정류장 또는 전체 노선 목록
  const routes=selectedStop
    ? (selectedStop.routes||[])
    : [...new Map(stopsData.stops.flatMap(s=>(s.routes||[]).map(r=>[r.rteNo,r])).filter(([,r])=>r)).entries()].map(([,r])=>r)
        .sort((a,b)=>a.rteNo.localeCompare(b.rteNo,undefined,{numeric:true})).slice(0,30);

  if(!routes.length) return '<div class="status"><span class="emoji">📅</span>정류장을 선택하거나 노선을 필터하면 배차 정보를 볼 수 있습니다.</div>';

  const title=selectedStop?`🚏 ${selectedStop.bsNm}`:"전체 노선 배차 (GPS 추정)";
  const btns=routes.map(r=>`<button class="sched-btn" data-rno="${r.rteNo}">${r.rteNo}</button>`).join("");
  return `<div style="font-weight:700;font-size:.85rem;margin-bottom:.4rem">${title}</div>
    <div style="font-size:.68rem;color:var(--muted);margin-bottom:.4rem">실시간 GPS 수집 시각 기반 추정값</div>
    <div class="sched-route-sel">${btns}</div>
    <div id="schedContent"></div>`;
}

function renderSchedContent(rteNo){
  if(!busData?.locations) return '<div style="color:var(--muted);font-size:.8rem">버스 위치 데이터 없음</div>';
  const toMin=s=>{const m=String(s).match(/(\d{2}):(\d{2})(?::\d{2})?$/);return m?+m[1]*60+ +m[2]:null;};
  const toHHMM=m=>`${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;

  const buses=busData.locations.filter(b=>b.rteNo===rteNo&&b.gthrDt);
  if(!buses.length) return '<div style="color:var(--muted);font-size:.8rem;padding:.5rem 0">이 노선 운행 데이터 없음</div>';

  const times=[...new Set(buses.map(b=>toMin(b.gthrDt)).filter(t=>t!==null))].sort((a,b)=>a-b);
  const diffs=[];
  for(let i=1;i<times.length;i++){const d=times[i]-times[i-1];if(d>0&&d<90)diffs.push(d);}
  const avg=diffs.length?Math.round(diffs.reduce((a,b)=>a+b,0)/diffs.length):null;

  const now=new Date(); const nowMin=now.getHours()*60+now.getMinutes();
  let rows=times.map(t=>({min:t,estimated:false}));
  if(avg&&times.length){const last=times[times.length-1];for(let i=1;i<=6;i++){const t=last+avg*i;if(t<1440)rows.push({min:t,estimated:true});}}

  let html=avg
    ?`<div style="background:rgba(121,192,255,.08);border:1px solid rgba(121,192,255,.2);border-radius:8px;padding:.55rem .8rem;margin-bottom:.6rem;font-size:.8rem;color:var(--accent2)">⏱ 평균 배차 <strong style="font-family:'Space Mono',monospace">${avg}분</strong> · 현재 ${buses.length}대 운행</div>`
    :`<div style="background:rgba(139,148,158,.08);border:1px solid var(--border);border-radius:8px;padding:.55rem .8rem;margin-bottom:.6rem;font-size:.78rem;color:var(--muted)">데이터 부족 (${buses.length}대)</div>`;

  html+=`<div class="sched-wrap"><table class="sched-table"><thead><tr><th>시각</th><th>상태</th><th>비고</th></tr></thead><tbody>`;
  rows.forEach(r=>{
    const diff=r.min-nowMin; let st,cls="";
    if(diff<-1){st="출발";cls="past-row";}else if(diff<=1){st="🚌 현재";cls="now-row";}else st=`${diff}분 후`;
    html+=`<tr class="${cls}"><td>${toHHMM(r.min)}</td><td>${st}</td><td>${r.estimated?'<span class="est-badge">추정</span>':""}</td></tr>`;
  });
  html+="</tbody></table></div>";
  return html;
}

/* ── 통계 탭 ── */
function renderStatsTab(){
  if(!stopsData||!busData) return '<div class="status"><div class="spinner"></div>로딩 중…</div>';

  const catCount={};
  stopsData.stops.forEach(s=>(s.routes||[]).forEach(r=>{
    const cat=r.category||classifyRoute(r.rteNo);
    catCount[cat]=(catCount[cat]||0)+1;
  }));

  const catRows=Object.entries(catCount).sort((a,b)=>b[1]-a[1]).map(([cat,cnt])=>{
    const {color,bg}=CAT[cat]||CAT["기타"];
    return `<tr><td><span style="font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:5px;border:1px solid ${color};color:${color};background:${bg}">${cat}</span></td><td style="font-family:'Space Mono',monospace;font-weight:700;color:var(--accent);text-align:right">${cnt}</td></tr>`;
  }).join("");

  return `<div class="stat-grid">
    <div class="stat-box"><div class="stat-lbl">전체 정류장</div><div class="stat-val">${stopsData.total_stops}</div><div class="stat-sub">개</div></div>
    <div class="stat-box"><div class="stat-lbl">운행 버스</div><div class="stat-val">${busData.total_buses}</div><div class="stat-sub">대</div></div>
  </div>
  <div style="font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem">노선 유형별 정류장 수</div>
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;overflow:hidden">
    <table style="width:100%;border-collapse:collapse">
      <thead><tr><th style="padding:.45rem .9rem;font-size:.65rem;color:var(--muted);text-align:left;background:var(--surface3);border-bottom:1px solid var(--border)">유형</th>
        <th style="padding:.45rem .9rem;font-size:.65rem;color:var(--muted);text-align:right;background:var(--surface3);border-bottom:1px solid var(--border)">정류장 수</th></tr></thead>
      <tbody>${catRows}</tbody>
    </table>
  </div>
  <div style="font-size:.65rem;color:var(--muted);margin-top:.7rem;line-height:1.6">
    갱신: ${stopsData.updated_at||"—"}<br>버스 갱신: ${busData.updated_at||"—"}
  </div>`;
}

/* ════════════════════════════════════════════
   유틸
════════════════════════════════════════════ */
function haversine(la1,lo1,la2,lo2){
  const R=6371e3,φ1=la1*Math.PI/180,φ2=la2*Math.PI/180;
  const Δφ=(la2-la1)*Math.PI/180,Δλ=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(Δφ/2)**2+Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function classifyRoute(rno){
  const b=String(rno).replace(/\s*\(.*?\)/g,"").trim();
  const T=new Set(["114","118","122","134","142","215","216","217","225","318","417","523","711","712","713","714","715","716","718","721","722","723","724","725","728","731","732","734","735","741","742","743","744","752","753","754","762","763","772","773"]);
  const E=new Set(["1134","1144","1154","1715"]);
  const C=new Set(["순환11","순환12","순환21","순환22"]);
  const B=new Set(["남구02","북구05"]);
  if(T.has(b)) return "일반시내버스";
  if(E.has(b)) return "좌석·직행좌석";
  if(C.has(b)) return "순환버스";
  if(B.has(b)) return "지선버스";
  return "기타";
}
function showStatus(emoji,msg,retry=false){
  document.getElementById("panelBody").innerHTML=
    `<div class="status"><span class="emoji">${emoji}</span>${msg}${retry?'<br><button class="locate-btn" onclick="loadData()">다시 시도</button>':""}</div>`;
}
